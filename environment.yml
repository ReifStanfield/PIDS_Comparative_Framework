# PIDS Comparative Framework - Conda Environment
# Complete environment specification for framework and all models
# Creates environment with Python 3.10, PyTorch, and all required dependencies

name: pids_framework
# conda-forge only: the Anaconda "defaults" channel can require a paid license
# at large institutions, and conda's PyTorch builds caused MKL and C++ ABI
# conflicts with the PyG extension wheels. PyTorch and PyG come from their
# official pip wheels below. DGL is not needed (no model imports it).
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  
  # ============================================
  # Scientific Computing
  # ============================================
  - numpy=1.23.5
  - scipy=1.10.1
  - pandas=1.5.3
  - scikit-learn=1.2.2
  
  # ============================================
  # Graph Libraries
  # ============================================
  - networkx=2.8.8
  
  # ============================================
  # Utilities
  # ============================================
  - tqdm
  - pyyaml
  - joblib
  - psutil
  
  # ============================================
  # Visualization
  # ============================================
  - matplotlib=3.7.1
  - seaborn=0.12.2
  
  # ============================================
  # Database Support (for Kairos and Orthrus)
  # ============================================
  - psycopg2=2.9.6
  - sqlalchemy=2.0.15
  
  # ============================================
  # Federated Learning (for Continuum_FL)
  # ============================================
  - mpi4py=3.1.3
  
  # ============================================
  # Development Tools
  # ============================================
  - pytest
  - black
  - flake8
  - isort
  
  # ============================================
  # Pip Dependencies
  # ============================================
  - pip:
    # PyTorch 1.12.1 + CUDA 11.6 (official wheels; they also run on CPU-only machines)
    - --extra-index-url https://download.pytorch.org/whl/cu116
    - torch==1.12.1+cu116
    - torchvision==0.13.1+cu116
    - torchaudio==0.12.1

    # PyTorch Geometric extensions built for torch 1.12.1 + cu116
    - --find-links https://data.pyg.org/whl/torch-1.12.1+cu116.html
    - torch-scatter==2.1.0
    - torch-sparse==0.6.16
    - torch-cluster==1.6.0
    # 2.1.0 was yanked (missing templates); 2.1.0.post1 is the fixed release
    - torch-geometric==2.1.0.post1

    # Model-specific utilities
    - xxhash==3.2.0
    - graphviz==0.20.1
    - python-louvain==0.16
    
    # Experiment tracking and logging
    - wandb==0.15.0
    - tensorboard==2.13.0
    
    # Configuration management
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    
    # Visualization
    - plotly==5.14.1
    - kaleido
    
    # Web frameworks (optional)
    - fastapi==0.95.2
    - uvicorn==0.22.0
    - flask==2.3.2
    
    # Federated learning dependencies (Continuum_FL)
    - paho-mqtt==1.6.1
    - redis==4.5.4

    # Download utilities
    - gdown>=4.7.1
    - requests>=2.28.0
